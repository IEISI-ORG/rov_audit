name: CI Framework

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-quality:
    name: Python Lint & Policy Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy requests pyyaml ruff

    - name: Lint with Ruff
      run: |
        # We allow some leeway for legacy scripts but check main engine
        ruff check rov_utils.py rov_no_scrape_v21.py statistics_v6.py

    - name: Run Policy Integrity Tests
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        python3 tests/test_policy_integrity.py

  go-quality:
    name: Go Build & Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Check Formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not formatted correctly:"
          gofmt -s -l .
          exit 1
        fi

    - name: Go Vet
      run: |
        go vet bgp-extractor.go
        go vet cone-calculator.go
        go vet fetch-roa.go

    - name: Compile Binaries
      run: |
        go build -o bgp-extractor bgp-extractor.go
        go build -o cone-calculator cone-calculator.go
        go build -o fetch-roa fetch-roa.go
