<header><img src="https://www.ieisi.org/images/apac_logo.png" alt="IEISI logo" /></header>
<h1 id="april-2018-a-bank-heist-using-the-internets-road-signs">April 2018: A Bank Heist Using the Internet's Road Signs</h1>
<p>A criminal group didn't break any encryption. They didn't hack any passwords.</p>
<p>They simply <strong>forged the internet's road signs</strong> — and redirected your customers to a fake bank.</p>
<div class="columns">
<div>
<h3 id="what-happened">What happened</h3>
<p>Amazon's domain name service was rerouted through a criminal server for <strong>two hours</strong>.</p>
<p>Customers of <strong>MyEtherWallet</strong> went to the real address — and arrived at a fake site that stole their credentials.</p>
<p><strong>~$150,000 USD stolen</strong> before the attack was stopped.</p>
</div>
<div>
<h3 id="what-amazon-the-bank-and-the-customers-had-in-common">What Amazon, the bank, and the customers had in common</h3>
<p>None of them were hacked.</p>
<p>The <strong>road signs were forged</strong> — and nobody on the route was checking whether the signs were real.</p>
<p>The attack was possible because the internet still largely operates on <strong>trust</strong>, not verification.</p>
</div>
</div>
<div class="box-red">
<p>This attack has a name: a <strong>BGP Route Hijack</strong>. And the defence has a name too: <strong>RPKI</strong>. Most Pacific networks do not have it.</p>
</div>
<footer>PITA 30 · Cook Islands · April 2026 · <a href="mailto:tcs@ieisi.org">tcs@ieisi.org</a></footer>

<h1 id="how-the-internets-addressing-system-actually-works">How the Internet's Addressing System Actually Works</h1>
<p>No jargon. Just the analogy.</p>
<div class="columns">
<div>
<h3 id="how-it-should-work">How it should work</h3>
<p>The internet is like a global postal network.</p>
<p>Every network has an address block. When your data travels, routers pass it along — like postal sorting offices — using <strong>route announcements</strong>: <em>&quot;I can deliver to addresses 203.x.x.x. Send them through me.&quot;</em></p>
<p>These announcements are supposed to be made only by the legitimate owner.</p>
</div>
<div>
<h3 id="the-problem">The problem</h3>
<p>Anyone can make an announcement.</p>
<p>Until recently, there was <strong>no signed certificate</strong> proving you owned the address space you claimed. Routers accepted announcements on trust.</p>
<p>A criminal — or a misconfigured network — can announce <em>your</em> address block. Your customers' traffic goes to them instead of you.</p>
<p><strong>Your customers never know.</strong></p>
</div>
</div>
<blockquote>
<p>RPKI is the system that fixes this. It adds signed, verifiable certificates of address ownership — and requires routers to check those certificates before accepting a route.</p>
</blockquote>

<h1 id="pacific-routing-security-the-uncomfortable-truth">Pacific Routing Security: The Uncomfortable Truth</h1>
<p>We audited <strong>every routable network on the internet</strong> — 120,000+ networks across 249 countries.</p>
<p>Here is what the Pacific looks like.</p>
<div class="columns">
<div>
<h3 id="the-numbers">The numbers</h3>
<div class="box-red">
<p><strong>Most Pacific networks are VULNERABLE.</strong></p>
<p>Of the major ISPs in Fiji, PNG, Solomon Islands, Samoa, Tonga, Kiribati, FSM, Vanuatu, and Tonga — the majority have <strong>no filtering</strong> of forged route announcements.</p>
<p>Your customers' traffic can be redirected, intercepted, or disrupted — and your router will helpfully forward it.</p>
</div>
</div>
<div>
<h3 id="what-vulnerable-means-in-practice">What vulnerable means, in practice</h3>
<table>
<thead>
<tr>
<th>Network</th>
<th>Country</th>
<th>Status</th>
</tr>
</thead>
<tbody>
<tr>
<td>Telecom Fiji</td>
<td>FJ</td>
<td>VULNERABLE</td>
</tr>

<h1 id="one-pacific-network-got-this-right">One Pacific Network Got This Right</h1>
<p>Not all Pacific operators are behind. One is a regional leader.</p>
<div class="box-green">
<h3 id="tonga-communications-corporation--secure-active-local-rov">Tonga Communications Corporation — SECURE (Active Local ROV)</h3>
<p>TCC has implemented full route filtering. Their APNIC routing security score is <strong>98.3%</strong> — among the highest of any network in the Pacific.</p>
<p>They made a decision. They assigned a technical resource. It is done.</p>
<p><strong>This is not a large-network problem. TCC is not the biggest ISP in the region. They just decided.</strong></p>
</div>
<p>The University of the South Pacific (Fiji) and OPT New Caledonia are also operating securely. These are not the largest networks. They are the most intentional ones.</p>
<blockquote>
<p>The difference between a protected network and a vulnerable one is rarely budget. It is almost always <strong>priority</strong>.</p>
</blockquote>

<h1 id="risk-1-your-customers-money-and-data">Risk 1: Your Customers' Money and Data</h1>
<p>Route hijacking is not theoretical. It has been used to commit financial fraud.</p>
<div class="columns">
<div>
<h3 id="the-attack-chain">The attack chain</h3>
<ol>
<li>Criminal announces your upstream's IP block</li>
<li>Your customers' banking or payment traffic is intercepted</li>
<li>Credentials are harvested at the criminal's server</li>
<li>Traffic is quietly forwarded — the customer sees nothing unusual</li>
<li>Accounts are drained</li>
</ol>
<p>This is called a <strong>man-in-the-middle via BGP hijack</strong>. It requires no access to your network, no malware on your customer's device.</p>
</div>
<div>
<h3 id="who-is-liable">Who is liable?</h3>
<p>In most Pacific jurisdictions, the legal framework is still developing — but the reputational framework is not.</p>
<p>If your customers' traffic was intercepted <strong>through your network</strong> because you did not implement an available, free, industry-standard protection — that is a conversation you will have in public.</p>
<p><strong>The question is not whether this can happen. It is whether it will happen to your customers on your watch.</strong></p>
</div>
</div>

<h1 id="risk-2-service-disruption-from-route-leaks">Risk 2: Service Disruption from Route Leaks</h1>
<p>The most common routing security incident is not a targeted attack. It is an <strong>accidental route leak</strong> — a misconfigured router at one network that accidentally advertises incorrect routes to the entire internet.</p>
<div class="columns">
<div>
<h3 id="2018-google-traffic-through-russia-and-china">2018: Google traffic through Russia and China</h3>
<p>A small ISP in Nigeria accidentally leaked Google's routes to Transtelecom (Russia), who passed them to China Telecom.</p>
<p>For <strong>74 minutes</strong>, Google traffic from parts of the world was rerouted through Russian and Chinese infrastructure.</p>
<p>Google Cloud, G Suite, and Search were degraded. Not because Google was hacked — because a network they had no relationship with was not filtering.</p>
</div>
<div>
<h3 id="what-this-means-for-pacific-operators">What this means for Pacific operators</h3>
<p>Your network depends on 1–3 upstream transit providers. If any of them fail to filter route leaks, <strong>your customers experience the outage</strong>.</p>
<p>In larger markets, there is enough redundancy that a leak is survivable. In Pacific island networks — where you may have one or two international cable connections — <strong>a major route leak can be a national internet outage</strong>.</p>
<p>Banking goes down. Government systems go down. Emergency services communications are disrupted.</p>
</div>
</div>

<h1 id="risk-3-regulatory-and-competitive-pressure-is-coming">Risk 3: Regulatory and Competitive Pressure Is Coming</h1>
<p>The window to act voluntarily is open. It will not stay open.</p>
<div class="columns">
<div>
<h3 id="what-is-already-happening-globally">What is already happening globally</h3>
<ul>
<li><strong>United States</strong> (CISA): Federal agencies required to implement RPKI; mandates extending to critical infrastructure operators</li>
<li><strong>European Union</strong> (NIS2 Directive): Network operators must implement &quot;state of the art&quot; routing security measures</li>
<li><strong>Australia</strong> (ASD): RPKI implementation included in Essential Eight equivalents for telcos</li>
<li><strong>MANRS</strong> (Mutually Agreed Norms for Routing Security): Growing list of ISPs publicly committing — customers and peers check this list</li>
</ul>
</div>
<div>
<h3 id="what-this-means-for-pacific-operators-1">What this means for Pacific operators</h3>
<p><strong>International peering partners are beginning to prefer or require RPKI-enabled peers.</strong></p>
<p>As traffic volume grows and Pacific networks seek better interconnection arrangements — better latency, lower cost, more peering — your routing security posture will be evaluated.</p>
<p>A network that is publicly listed as VULNERABLE in global audits is a liability in peering negotiations.</p>
<p><strong>Being secure is increasingly a commercial advantage, not just a technical hygiene measure.</strong></p>
</div>
</div>

<h1 id="what-does-it-cost-to-fix-this">What Does It Cost to Fix This?</h1>
<p>This is where most executives expect a large procurement conversation. It is not.</p>
<div class="columns">
<div>
<h3 id="the-honest-answer-mostly-your-engineers-time">The honest answer: mostly your engineers' time</h3>
<p>RPKI implementation — for most Pacific networks — is:</p>
<ul>
<li>A <strong>software configuration change</strong> on your existing routers</li>
<li>Supported natively by Cisco IOS-XR, Juniper JunOS, Nokia SR-OS, and open-source platforms</li>
<li>Deployed in <strong>days to weeks</strong> for a straightforward network</li>
<li>Free to register certificates (through your RIR — APNIC)</li>
<li>Operationally maintained with minimal ongoing overhead</li>
</ul>
<p><strong>There is no major hardware purchase. There is no new vendor relationship. The standards are published and free.</strong></p>
</div>
<div>
<h3 id="the-real-cost">The real cost</h3>
<p>The real cost is <strong>management attention</strong>.</p>
<ul>
<li>Someone has to prioritise it over the next feature request</li>
<li>The network team needs dedicated time — not &quot;when we have capacity&quot;</li>
<li>Leadership must make it clear this is not optional</li>
</ul>
<p>This is exactly the kind of decision that does not happen without executive mandate.</p>
<p><strong>If you leave the room today and say nothing, your network will still be vulnerable at PITA 31.</strong></p>
</div>
</div>
<div class="box">
<p>The fix is free. The delay is a choice. The risk accumulates daily.</p>
</div>

<h1 id="the-riskcost-frame-for-the-board">The Risk/Cost Frame for the Board</h1>
<div class="columns3">
<div class="box-red">
<h3 id="doing-nothing">Doing nothing</h3>
<ul>
<li>Known vulnerabilities remain</li>
<li>Customers exposed to financial fraud risk</li>
<li>Service disruption from upstream leaks unremediated</li>
<li>Growing regulatory exposure</li>
<li>Competitive disadvantage as global standards tighten</li>
</ul>
<p><strong>Cost: zero upfront. Liability: ongoing and increasing.</strong></p>
</div>
<div class="box">
<h3 id="partial-action">Partial action</h3>
<ul>
<li>ROA certificates registered but no filtering = incomplete</li>
<li>Filtering enabled but no certificate = incomplete</li>
<li>Both required, both must be active</li>
</ul>
<p><strong>Common mistake: doing half the job and assuming you're protected.</strong></p>
</div>
<div class="box-green">
<h3 id="full-implementation">Full implementation</h3>
<ul>
<li>Route Origin Authorizations (ROA) registered with APNIC</li>
<li>Route Origin Validation (ROV) filtering enabled on border routers</li>
<li>Ongoing monitoring via RIPE RIPEstat or BGP.Tools</li>
</ul>
<p><strong>Cost: engineering time. Benefit: customers protected, regulatory exposure reduced, commercial positioning improved.</strong></p>
</div>

<h1 id="the-three-decisions-that-change-your-status">The Three Decisions That Change Your Status</h1>
<p>You do not need to understand the technology. You need to make three calls.</p>

<div>
<h3 id="decision-1-prioritise-it">Decision 1: Prioritise it</h3>

<p>Set a target: <strong>fully implemented before PITA 31</strong>.</p>
<p>This is an instruction, not a request.</p>

<h3 id="decision-2-resource-it">Decision 2: Resource it</h3>
<p>Assign a named technical owner. Allocate protected time — not &quot;when you have a window&quot;.</p>
<p>Budget for APNIC training if your team needs it. The cost is a few thousand dollars. The alternative is the risk on the previous slides.</p>
</div>
<div>
<h3 id="decision-3-verify-it">Decision 3: Verify it</h3>
<p>Once implementation is reported complete, verify it.</p>
<p>Your APNIC routing security score should be <strong>above 90%</strong>.<br />
Your network should no longer appear as VULNERABLE in public global audits.</p>
<p>Both are free, public tools that take five minutes to check.</p>
<p><strong>&quot;My team said it's done&quot; is not verification. A 98% APNIC score is verification — the same score Tonga Communications achieved.</strong></p>

" lang="en-AU" data-marpit-pagination="19" style="--paginate:true;--footer:PITA 30 · Cook Islands · April 2026 · tcs@ieisi.org;--header:![IEISI logo](https://www.ieisi.org/images/apac_logo.png);--background-color:#F8F9FA;--color:#333333;--theme:default;--style:@import url('https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@25..151,100..1000&amp;display=swap')

<header><img src="https://www.ieisi.org/images/apac_logo.png" alt="IEISI logo" /></header>
<h1 id="summary-the-executive-version">Summary: The Executive Version</h1>
<div class="columns">
<div>
<h3 id="the-problem-1">The problem</h3>
<p>The internet's routing system was built on trust. That trust is exploited — by criminals, by accidents, by misconfigured networks.</p>
<p>Forged route announcements can redirect your customers' traffic. Money is stolen this way. Services are disrupted this way.</p>
<p>Most Pacific networks — including most of the major ISPs in this room — are currently <strong>not protected</strong>.</p>
</div>
<div>
<h3 id="the-solution">The solution</h3>
<p>RPKI is the standard fix. It is:</p>
<ul>
<li>Free to implement</li>
<li>Supported on all major network hardware</li>
<li>Already in use by 86% of the world's top 100 networks</li>
<li>Already implemented by Tonga Communications Corporation in the Pacific</li>
</ul>
<h3 id="your-role">Your role</h3>
<p>The technology is not the barrier. <strong>The barrier is a decision</strong>.</p>
<p>That decision sits with the people in this room.</p>
</div>
</div>
<div class="box">
<p><strong>One ask:</strong> Leave today with a named person, a target date, and a commitment to check your APNIC score at PITA 31. That is all it takes to start.</p>
</div>
<footer>PITA 30 · Cook Islands · April 2026 · <a href="mailto:tcs@ieisi.org">tcs@ieisi.org</a></footer>
</section>

<h1 id="appendix-where-to-start-tomorrow">Appendix: Where to Start Tomorrow</h1>
<p>For your technical team — the three-step path to SECURE status.</p>
<div class="columns3">
<div class="box">
<h3 id="step-1-register-your-routes">Step 1: Register your routes</h3>
<p>Create Route Origin Authorization (ROA) records with APNIC for every prefix your network announces.</p>
<p><strong>Resource:</strong> my.apnic.net → RPKI</p>
<p><strong>Time:</strong> 1–2 days for a typical Pacific ISP</p>
</div>
<div class="box">
<h3 id="step-2-enable-filtering">Step 2: Enable filtering</h3>
<p>Configure your border routers to drop BGP announcements that fail RPKI validation.</p>
<p><strong>Resource:</strong> RIPE NCC RPKI documentation; your router vendor's RPKI implementation guide</p>
<p><strong>Time:</strong> 1–5 days depending on platform</p>
</div>
<div class="box">
<h3 id="step-3-verify-and-monitor">Step 3: Verify and monitor</h3>
<p>Check your score on <strong>stat.ripe.net/app/launchpad</strong> and <strong>bgp.tools</strong> — your network's RPKI status is publicly visible.</p>
<p>Target: APNIC routing security score <strong>≥ 95%</strong></p>
<p><strong>Time:</strong> Ongoing; alerts available</p>
</div>
</div>
<div class="box">
<p><strong>Regional support:</strong> APNIC provides training, documentation, and direct technical assistance to Pacific network operators at no cost. Contact: <a href="mailto:training@apnic.net">training@apnic.net</a></p>
</div>
